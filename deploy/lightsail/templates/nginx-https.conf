map $http_upgrade $podcazt_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name @@TLS_SERVER_NAMES@@;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://@@APP_DOMAIN@@$request_uri; }
}

server {
    listen 443 ssl;
    server_name @@APP_DOMAIN@@;
    ssl_certificate /etc/letsencrypt/live/@@APP_DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@APP_DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PodcaztTLS:10m;
    server_tokens off;
    client_max_body_size 6m;

    # Avoid logging short-lived WebSocket tokens and signed URL query strings.
    access_log off;
    error_log /var/log/nginx/podcazt-error.log warn;

    location = /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $podcazt_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
