name: podcazt-local

x-app: &app
  image: podcazt:local
  env_file: .env
  init: true
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging:
    options: { max-size: "10m", max-file: "2" }

services:
  web:
    <<: *app
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${DOCKER_LIBRARY_PREFIX:-}node:22-bookworm-slim"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
  signaling:
    <<: *app
    command: [node, --import, tsx, server/signaling.ts]
  nginx:
    image: ${DOCKER_LIBRARY_PREFIX:-}nginx:stable-alpine
    ports:
      - "${LOCAL_HTTPS_BIND_IP:-127.0.0.1}:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      web: { condition: service_healthy }
      signaling: { condition: service_started }
  postgres:
    image: ${DOCKER_LIBRARY_PREFIX:-}postgres:16-bookworm
    environment:
      POSTGRES_USER: podcazt
      POSTGRES_DB: podcazt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/local/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U podcazt -d podcazt"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: ${DOCKER_LIBRARY_PREFIX:-}redis:7-bookworm
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, volatile-lru, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:latest}
    user: "0:0"
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        exec turnserver -n --log-file=stdout --simple-log
        --listening-ip=0.0.0.0 --relay-ip=172.30.50.10
        --external-ip="$${LOCAL_TURN_IP}/172.30.50.10"
        --realm=podcazt.test --fingerprint --use-auth-secret
        --static-auth-secret="$${TURN_SHARED_SECRET}"
        --cert=/certs/cert.pem --pkey=/certs/key.pem
        --listening-port=3478 --tls-listening-port=5349
        --min-port=49160 --max-port=49259 --no-tcp-relay
        --user-quota=12 --total-quota=40 --no-multicast-peers
    environment:
      LOCAL_TURN_IP: ${LOCAL_TURN_IP:?Set your computer's LAN IPv4 in deploy/local/.env}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in deploy/local/.env}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49259:49160-49259/udp"
    volumes:
      - ./certs:/certs:ro
    networks:
      default:
        ipv4_address: 172.30.50.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.50.0/24
volumes:
  postgres:
