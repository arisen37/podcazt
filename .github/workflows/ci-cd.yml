name: CI and EC2 deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcazt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, tests, and production build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check deployment scripts
        run: |
          for script in deploy/aws/*.sh; do bash -n "$script"; done

  image:
    name: Build and publish ARM64 image
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure deployment SSH
        env:
          EC2_DEPLOY_KEY: ${{ secrets.EC2_DEPLOY_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: bash deploy/aws/prepare-ssh.sh
      - name: Check EC2 access before building
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/podcazt-ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/podcazt-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: true
          tags: ghcr.io/arisen37/podcazt:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/arisen37/podcazt
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: NODE_IMAGE=public.ecr.aws/docker/library/node:22-bookworm-slim
          cache-from: type=gha,scope=podcazt-arm64
          cache-to: type=gha,mode=max,scope=podcazt-arm64
      - name: Smoke test published image
        env:
          IMAGE: ghcr.io/arisen37/podcazt@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --network none --entrypoint node "$IMAGE" scripts/verify-runtime.mjs

  deploy:
    name: Deploy to EC2
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment:
      name: production
      url: https://podcazt.arisen37.xyz
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure deployment SSH
        env:
          EC2_DEPLOY_KEY: ${{ secrets.EC2_DEPLOY_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: bash deploy/aws/prepare-ssh.sh
      - name: Deploy immutable image and wait for health checks
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          RELEASE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$RUNNER_TEMP/podcazt-ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/podcazt-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$EC2_USER@$EC2_HOST" "deploy $RELEASE_SHA $IMAGE_DIGEST $REGISTRY_USER"
